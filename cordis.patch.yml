# qq-groupmate 的默认配置。
#
# 三点注意：
# 1. enabled 默认 false —— 装上不会立刻连 NapCat，确认下面填好后再改成 true。
# 2. groups.allow 留空 = 不参与任何群。这是防误连的硬保险。
# 3. provider / model 必须填你自己的模型路由，否则插件不会启动。
#
# 改完保存即可，插件会热重载（连接闪断 1–2 秒，会话记忆不丢）。
- insert:
    - id: qq-groupmate
      name: '@local/qq-groupmate'
      config:
        enabled: false

        connection:
          wsUrl: 'ws://127.0.0.1:3001'
          # 存 access_token 的「环境变量名」，不要在这里写明文 token。
          tokenEnv: 'NAPCAT_TOKEN'
          # 留空则用事件里的 self_id。
          selfId: ''
          reconnectMinMs: 800
          reconnectMaxMs: 30000

        groups:
          # 只在这些群里活动。留空 = 哪个群都不参与。
          allow: []
          # allow:
          #   - '123456789'
          # 静默时段，支持跨零点；留空表示全天可参与。
          quietHours: '01:00-08:00'

        persona:
          name: '小满'
          bio: '群里的老潜水员，偶尔冒一句，不刷屏。'
          interests:
            - '游戏'
            - '动漫'
            - '夜宵'
          speech: '短句、口语，偶尔只回一个表情。'
          # 偶尔发作的另一套腔调：填几句示例，留空表示没有这个彩蛋。
          flare: ''
          # 每轮发作概率：0.2 ≈ 五次开口发作一次。
          flareRate: 0.2

        gate:
          # 留空则复用 speaker 的模型。
          provider: ''
          model: ''
          # 越高越沉默。
          threshold: 0.5
          # 消息聚合窗口：收到一条消息后等这么久再判断。
          windowMs: 2500
          maxWindowMs: 8000
          contextSize: 30
          # 至少攒够几条新消息才判断；调大省 token、反应变慢。
          minMessages: 1

        speaker:
          # agent：每群一个持久会话（有记忆、能看图、能联网）；llm：一次性调用（快、便宜、无记忆）。
          kind: 'agent'
          provider: ''
          model: ''
          maxMessages: 2
          # 单条字数上限；超长会断在标点上，不会从词中间切。
          maxChars: 56
          # 每轮最多附几张图给模型看，0 = 不看图。
          maxImages: 2

        agent:
          # 群会话的工作目录，也决定日志和群友档案落在哪。
          cwd: 'E:\quit-code\qq-groups'
          # 单次发言最长等待，超时会取消这一轮。
          turnTimeoutMs: 60000
          # 会话闲置多久后释放内存（历史仍留在磁盘）。
          ttlMs: 1800000
          # 群友能用的全局工具白名单；留空则只有发言本身。
          allowTools:
            - 'web_search'
            - 'web_fetch'

        rate:
          # 同一群两次「开口」的最小间隔。
          minGapMs: 12000
          # 每小时最多发言几次；被 @ 不受此限。
          maxPerHour: 8
          # 勾选后不限条数，但冷却和熔断仍然生效。
          unlimited: false

        proactive:
          # 冷场时主动挑起话题。主动发言更容易触发风控，默认关闭。
          enabled: false
          # 群里安静多少分钟后才考虑。
          idleMinutes: 240
          # 两次主动开口之间至少隔多久。
          minGapMinutes: 360
          # 每个群每天最多主动几次。
          maxPerDay: 1
          # 允许它先联网搜一下再开口（仅 agent 后端有效）。
          search: true
